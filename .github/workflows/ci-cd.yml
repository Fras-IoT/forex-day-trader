name: CI/CD & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: PHP Lint & Automated Tests (MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 with MongoDB extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, xml, bcmath, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP Syntax Check
        run: find app routes config tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run Laravel Feature Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: forex_day_trader_test
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: php artisan test --filter=ForexTraderWorkflowTest

  security:
    name: Security Checks (Audit, Secrets & Container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4 for Composer Audit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, openssl

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer Security Audit (CVE Check)
        run: composer audit

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image for Scan
        run: docker build -t forex-day-trader:ci .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: forex-day-trader:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to Render
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret belum diatur. Melewati auto-deploy."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy Render berhasil dipicu setelah seluruh test & security check lulus."

