name: CI/CD & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: PHP Lint & Automated Tests (MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 with MongoDB extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, xml, bcmath, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP Syntax Check
        run: find app routes config tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run Laravel Feature Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: forex_day_trader_test
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: php artisan test --filter=ForexTraderWorkflowTest

  security:
    name: Security Checks (Audit, Secrets & Container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4 for Composer Audit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, openssl

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer Security Audit (CVE Check)
        run: composer audit

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image for Scan
        run: docker build -t forex-day-trader:ci .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forex-day-trader:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to VPS (72.62.126.151)
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH & Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '72.62.126.151' }}
          VPS_USER: ${{ secrets.VPS_USER || 'frastio' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/home/frastio/forex-day-trader' }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_SSH_KEY secret belum diatur. Melewati auto-deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" << EOF
            set -e
            APP_DIR="$VPS_APP_DIR"
            if [ ! -d "\$APP_DIR/.git" ]; then
              for d in /var/www/forex-day-trader "\$HOME/forex-day-trader" /opt/forex-day-trader /srv/forex-day-trader; do
                if [ -d "\$d/.git" ]; then
                  APP_DIR="\$d"
                  break
                fi
              done
            fi
            if [ ! -d "\$APP_DIR/.git" ]; then
              APP_DIR=\$(find /var /home /opt /srv -maxdepth 4 -type d -name "forex-day-trader" 2>/dev/null | head -n 1)
            fi
            echo "Deploying in: \$APP_DIR"
            cd "\$APP_DIR"
            git pull origin main
            docker compose up -d --build
            docker image prune -f
          EOF

