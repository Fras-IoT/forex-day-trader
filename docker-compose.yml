services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forex-day-trader
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8085:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
    volumes:
      - ./storage/logs:/var/www/html/storage/logs

  mongodb:
    image: mongo:7
    container_name: forex-day-trader-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-frastio}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-frastioganteng}"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
